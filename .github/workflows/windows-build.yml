name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # only used to push the test report as a git note (refs/notes/ci)
  checks: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > requirements-lock.txt

      - name: Static checks
        run: |
          python -m ruff check .
          python -m compileall -q main.py app tools

      - name: Unit / integration tests (fake devices, fake model)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rA

      - name: Download speech models
        run: python tools/fetch_models.py tiny base small --dest models

      - name: Self-test from source (real faster-whisper models)
        run: |
          python main.py --self-test --model tiny --report selftest-source-tiny.json
          python main.py --self-test --model small --report selftest-source-small.json

      - name: Set up a Windows audio device (virtual sound card)
        uses: LABSN/sound-ci-helpers@v1
        continue-on-error: true

      - name: Allow desktop apps to use the microphone (Windows privacy setting)
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($root in 'HKCU:', 'HKLM:') {
            $k = "$root\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Force -Path "$k\NonPackaged" | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow
            Set-ItemProperty -Path "$k\NonPackaged" -Name Value -Value Allow
          }

      - name: Real WASAPI loopback capture test from source
        continue-on-error: true
        run: python main.py --self-test --model tiny --capture-test --report selftest-capture-source.json

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean MeetingTranscriber.spec

      - name: Bundle base + small models into the build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MeetingTranscriber/models | Out-Null
          Copy-Item -Recurse models/base, models/small dist/MeetingTranscriber/models/
          Copy-Item README.md, requirements-lock.txt dist/MeetingTranscriber/

      - name: Self-test the built exe (bundled model, offline)
        shell: pwsh
        env:
          MEETINGTRANSCRIBER_OFFLINE: '1'
        run: |
          $p = Start-Process dist/MeetingTranscriber/MeetingTranscriber.exe -ArgumentList '--self-test','--report',"$PWD/selftest-exe.json" -Wait -PassThru
          Get-Content selftest-exe.json
          if ($p.ExitCode -ne 0) { throw "exe self-test failed ($($p.ExitCode))" }

      - name: Real WASAPI loopback capture test with the built exe
        shell: pwsh
        continue-on-error: true
        env:
          MEETINGTRANSCRIBER_OFFLINE: '1'
        run: |
          $p = Start-Process dist/MeetingTranscriber/MeetingTranscriber.exe -ArgumentList '--self-test','--capture-test','--report',"$PWD/selftest-capture-exe.json" -Wait -PassThru
          Get-Content selftest-capture-exe.json
          if ($p.ExitCode -ne 0) { throw "exe capture test failed ($($p.ExitCode))" }

      - name: Launch the GUI exe and take a screenshot
        shell: pwsh
        run: |
          $p = Start-Process dist/MeetingTranscriber/MeetingTranscriber.exe -ArgumentList '--gui-smoke-test','20' -PassThru
          Start-Sleep 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/gui-screenshot.png")
          if ($p.HasExited) { throw "GUI exited early with code $($p.ExitCode)" }
          $p.WaitForExit(30000) | Out-Null
          if ($p.ExitCode -ne 0) { throw "GUI exit code $($p.ExitCode)" }
          $log = Get-Content "$env:LOCALAPPDATA/MeetingTranscriber/logs/app.log" -Tail 60
          $log
          if ($log -match 'Device enumeration failed') { throw 'GUI could not list audio devices' }
          if (-not ($log -match 'Devices: \d+ microphones')) { throw 'GUI did not report audio devices' }

      - name: Publish self-test report as a check run
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci_report.py ${{ github.sha }} check.json "selftest-*.json" --log "$env:LOCALAPPDATA/MeetingTranscriber/logs/app.log"
          gh api repos/${{ github.repository }}/check-runs --input check.json | Out-Null
          python -c "import json; print(json.load(open('check.json'))['output']['text'])" > report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/notes/ci:refs/notes/ci 2>$null
          git notes --ref ci add -f -F report.md ${{ github.sha }}
          git push -f origin refs/notes/ci

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MeetingTranscriber-windows-x64
          path: dist/MeetingTranscriber

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            selftest-*.json
            gui-screenshot.png
            requirements-lock.txt
            ${{ env.LOCALAPPDATA }}/MeetingTranscriber/logs/*.log
